name: Test and release desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'ui/**', 'tests/**', 'scripts/**', 'examples/**', 'package*.json', 'tailwind.config.cjs', '.github/workflows/build.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: pack:win
            asset: dist/MindFlow-1.0.0-win.zip
          - os: ubuntu-latest
            script: pack:linux
            asset: dist/MindFlow-1.0.0-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: npm run test:web
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: runner.os == 'Linux'
        run: |
          node scripts/check-packaged-mcp.mjs
          tar -czf dist/MindFlow-1.0.0-linux-x64.tar.gz -C dist/linux-unpacked .
      - uses: actions/upload-artifact@v4
        with:
          name: mindflow-${{ matrix.os }}
          path: ${{ matrix.asset }}
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mindflow-*
          path: release-assets
          merge-multiple: true
      - name: Publish immutable v1.0.0 release if absent
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo 'Release v1.0.0 already exists; leaving its tag and assets unchanged.'
            exit 0
          fi
          cat > release-notes.md <<'NOTES'
          MindFlow Desktop: local whiteboard, complete/context JSON export, and local stdio MCP.

          - Windows x64: unzip and run MindFlow.exe. Keep the whole folder.
          - Linux x64: extract and run ./mindflow-desktop.
          - Built-in runtime; no separate Node.js installation needed.
          - MCP config: open the app and click MCP 接入. Read-only by default.
          - Packages are unsigned. Linux desktop workflows and real MCP read/write were tested; Windows was built and passed core/MCP tests in CI, but has not been manually GUI-tested.
          - GitHub Pages browser edition stores data in the browser; it does not run the local MCP server.
          NOTES
          gh release create v1.0.0 release-assets/* --target "$RELEASE_SHA" --title 'MindFlow Desktop 1.0.0' --notes-file release-notes.md

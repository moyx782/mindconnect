name: 桌面版构建与发布 / Desktop builds and releases
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/releases/**', 'index.html', 'src/**', 'ui/**', 'tests/**', 'scripts/**', 'examples/**', 'package*.json', 'tailwind.config.cjs', '.github/workflows/build.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: pack:win
            asset: dist/MindFlow-*-win.zip
          - os: ubuntu-latest
            script: pack:linux
            asset: dist/MindFlow-*-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: npm run test:web
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: runner.os == 'Linux'
        run: |
          node scripts/check-packaged-mcp.mjs
          version=$(node -p "require('./package.json').version")
          tar -czf "dist/MindFlow-${version}-linux-x64.tar.gz" -C dist/linux-unpacked .
      - uses: actions/upload-artifact@v4
        with:
          name: mindflow-${{ matrix.os }}
          path: ${{ matrix.asset }}
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mindflow-*
          path: release-assets
          merge-multiple: true
      - name: 发布版本与双语说明 / Publish release and bilingual notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          notes="docs/releases/${tag}.md"
          for file in docs/releases/v*.md; do
            previous=$(basename "$file" .md)
            if [[ "$previous" != "$tag" ]]; then
              title="MindFlow 桌面版 / MindFlow Desktop ${previous#v}"
              if [[ "$(gh release view "$previous" --json body --jq .body)" != "$(cat "$file")" || "$(gh release view "$previous" --json name --jq .name)" != "$title" ]]; then
                gh release edit "$previous" --title "$title" --notes-file "$file"
              fi
            fi
          done
          title="MindFlow 桌面版 / MindFlow Desktop ${tag#v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file "$notes"
          else
            gh release create "$tag" release-assets/* --target "$GITHUB_SHA" --title "$title" --notes-file "$notes"
          fi

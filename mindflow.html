<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MindFlow · 空间灵感白板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '"Noto Sans SC"', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'card': '0 2px 8px -2px rgba(15, 23, 42, 0.08), 0 1px 3px -1px rgba(15, 23, 42, 0.04)',
            'card-hover': '0 8px 20px -4px rgba(15, 23, 42, 0.12), 0 4px 8px -2px rgba(15, 23, 42, 0.06)',
            'card-selected': '0 0 0 2px #3b82f6, 0 10px 24px -4px rgba(59, 130, 246, 0.22)',
            'float': '0 10px 30px -5px rgba(15, 23, 42, 0.14), 0 4px 10px -3px rgba(15, 23, 42, 0.06)',
          }
        }
      }
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif;
    }
    input, textarea {
      user-select: text;
      -webkit-user-select: text;
    }

    /* 动态点阵背景 */
    #canvas-viewport {
      background-color: #f8f8f7;
      background-image: radial-gradient(#d6d3d1 1.15px, transparent 1.15px);
      background-size: 24px 24px;
      touch-action: none;
    }
    .dark #canvas-viewport {
      background-color: #141416;
      background-image: radial-gradient(#2e2e34 1.15px, transparent 1.15px);
    }

    /* 空间变换层 */
    #world-layer {
      transform-origin: 0 0;
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      will-change: transform;
    }

    /* 词条卡片 Token 样式与语义配色 */
    .token-node {
      position: absolute;
      min-width: 96px;
      max-width: 280px;
      border-radius: 14px;
      transition: box-shadow 0.15s ease, transform 0.08s ease, border-color 0.15s ease;
      cursor: grab;
    }
    .token-node:active {
      cursor: grabbing;
    }

    /* 配色主题 */
    .theme-neutral {
      background-color: #ffffff;
      border: 1.5px solid #e7e5e4;
      color: #1c1917;
    }
    .dark .theme-neutral {
      background-color: #202024;
      border: 1.5px solid #34343b;
      color: #f4f4f5;
    }

    .theme-yellow {
      background-color: #fef9c3;
      border: 1.5px solid #fde047;
      color: #713f12;
    }
    .dark .theme-yellow {
      background-color: #362f12;
      border: 1.5px solid #715e18;
      color: #fef08a;
    }

    .theme-blue {
      background-color: #e0f2fe;
      border: 1.5px solid #7dd3fc;
      color: #0c4a6e;
    }
    .dark .theme-blue {
      background-color: #122b3d;
      border: 1.5px solid #1e5378;
      color: #bae6fd;
    }

    .theme-green {
      background-color: #dcfce7;
      border: 1.5px solid #86efac;
      color: #14532d;
    }
    .dark .theme-green {
      background-color: #123322;
      border: 1.5px solid #1e633e;
      color: #bbf7d0;
    }

    .theme-red {
      background-color: #fee2e2;
      border: 1.5px solid #fca5a5;
      color: #7f1d1d;
    }
    .dark .theme-red {
      background-color: #381619;
      border: 1.5px solid #73262c;
      color: #fecaca;
    }

    .theme-purple {
      background-color: #f3e8ff;
      border: 1.5px solid #d8b4fe;
      color: #581c87;
    }
    .dark .theme-purple {
      background-color: #2b183d;
      border: 1.5px solid #582d82;
      color: #e9d5ff;
    }

    /* 选中状态高亮 */
    .token-node.selected {
      box-shadow: 0 0 0 2.5px #3b82f6, 0 10px 24px -4px rgba(59, 130, 246, 0.25) !important;
      z-index: 30;
    }

    /* 悬停显示连接锚点与发散加号 */
    .token-node .node-handle,
    .token-node .quick-branch-btn {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    .token-node:hover .node-handle,
    .token-node:hover .quick-branch-btn,
    .token-node.selected .node-handle,
    .token-node.selected .quick-branch-btn {
      opacity: 1;
      pointer-events: auto;
    }

    /* 连线交互 */
    .edge-path-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 16px;
      cursor: pointer;
      pointer-events: stroke;
    }
    .edge-path-visible {
      fill: none;
      stroke: #a8a29e;
      stroke-width: 2px;
      transition: stroke 0.15s ease, stroke-width 0.15s ease;
      pointer-events: none;
    }
    .dark .edge-path-visible {
      stroke: #52525b;
    }
    .edge-group:hover .edge-path-visible {
      stroke: #3b82f6;
      stroke-width: 2.5px;
    }
    .edge-group.selected .edge-path-visible {
      stroke: #3b82f6;
      stroke-width: 3px;
    }

    /* 手绘笔迹与图形层交互 */
    .drawing-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 16px;
      cursor: grab;
      pointer-events: stroke;
    }
    .drawing-shape-fill {
      cursor: grab;
      pointer-events: all;
    }
    .drawing-group.selected .drawing-outline {
      filter: drop-shadow(0 0 4px rgba(59, 130, 246, 0.7));
    }

    /* 群组容器 Cluster */
    .cluster-box {
      position: absolute;
      border-radius: 20px;
      border: 1.5px dashed rgba(120, 113, 108, 0.38);
      background-color: rgba(231, 229, 228, 0.35);
      backdrop-filter: blur(2px);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .dark .cluster-box {
      border-color: rgba(161, 161, 170, 0.28);
      background-color: rgba(39, 39, 42, 0.42);
    }
    .cluster-box.selected {
      border: 2px solid #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    /* 绘图模式下禁用下层元素误触 */
    .drawing-mode-active .token-node,
    .drawing-mode-active .cluster-box,
    .drawing-mode-active .edge-path-hit,
    .drawing-mode-active .drawing-hit,
    .drawing-mode-active .drawing-shape-fill {
      pointer-events: none !important;
    }

    /* 平滑弹出动画 */
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.92) translateY(4px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-pop {
      animation: popIn 0.14s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.4);
      border-radius: 999px;
    }
  </style>
</head>
<body class="text-stone-800 dark:text-zinc-100 antialiased">

  <!-- 1. 主无限画布视口 -->
  <div id="canvas-viewport" class="relative w-full h-full overflow-hidden cursor-default">
    
    <!-- 世界坐标系容器 -->
    <div id="world-layer">
      <!-- 群组容器层（最底层） -->
      <div id="clusters-layer"></div>

      <!-- 手绘笔迹、图形与直线 SVG 层 -->
      <svg id="drawings-svg" class="overflow-visible pointer-events-none" style="position:absolute; top:0; left:0; width:1px; height:1px;">
        <g id="drawings-container"></g>
        <g id="temp-drawing-container" class="pointer-events-none"></g>
      </svg>

      <!-- SVG 贝塞尔连线层 -->
      <svg id="edges-svg" class="overflow-visible pointer-events-none" style="position:absolute; top:0; left:0; width:1px; height:1px;">
        <defs>
          <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#a8a29e" />
          </marker>
          <marker id="arrowhead-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#52525b" />
          </marker>
          <marker id="arrowhead-selected" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#3b82f6" />
          </marker>
        </defs>
        <g id="edges-container"></g>
        <path id="temp-edge-path" d="" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="5,5" class="hidden pointer-events-none" />
      </svg>

      <!-- 连线标签层 -->
      <div id="edge-labels-layer"></div>

      <!-- 词条卡片 Token 层 -->
      <div id="tokens-layer"></div>
    </div>

    <!-- 框选矩形（屏幕坐标系） -->
    <div id="marquee-box" class="hidden fixed pointer-events-none border border-blue-500 bg-blue-500/10 rounded-lg z-40"></div>

    <!-- 双击快速新建 Token 浮层输入框 -->
    <div id="quick-input-box" class="hidden fixed z-50 animate-pop">
      <div class="bg-white dark:bg-zinc-800 rounded-2xl shadow-float border border-stone-200 dark:border-zinc-700 p-1.5 flex items-center gap-1.5 min-w-[220px]">
        <input
          id="quick-input-field"
          type="text"
          placeholder="输入灵感词条，回车生成..."
          class="w-full px-3 py-1.5 text-sm bg-transparent outline-none text-stone-800 dark:text-zinc-100 placeholder-stone-400 dark:placeholder-zinc-500"
          autocomplete="off"
        />
        <button id="quick-input-confirm" title="回车确认" class="px-2.5 py-1.5 rounded-xl bg-stone-900 dark:bg-zinc-100 text-white dark:text-zinc-900 text-xs font-medium hover:opacity-90 transition shrink-0">
          ↵
        </button>
      </div>
    </div>

    <!-- 2. 顶部极简克制工具栏 -->
    <header class="fixed top-4 left-4 right-4 z-40 flex items-center justify-between pointer-events-none">
      <!-- 左侧品牌与看板标题 -->
      <div class="pointer-events-auto flex items-center gap-2.5 bg-white/85 dark:bg-zinc-900/85 backdrop-blur-md border border-stone-200/80 dark:border-zinc-800 px-3.5 py-2 rounded-2xl shadow-card">
        <div class="w-6 h-6 rounded-lg bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center text-white font-bold text-xs shadow-sm">
          ✦
        </div>
        <input
          id="board-title-input"
          type="text"
          value="未命名头脑风暴"
          class="bg-transparent text-sm font-semibold text-stone-800 dark:text-zinc-100 outline-none w-36 sm:w-48 truncate focus:bg-stone-100 dark:focus:bg-zinc-800 px-1.5 py-0.5 rounded-lg transition"
          title="点击修改白板标题"
        />
        <span id="save-status" class="hidden sm:inline-flex items-center gap-1 text-[11px] text-stone-400 dark:text-zinc-500 pl-2 border-l border-stone-200 dark:border-zinc-800">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> 已自动保存
        </span>
      </div>

      <!-- 右侧操作区 -->
      <div class="pointer-events-auto flex items-center gap-1.5 bg-white/85 dark:bg-zinc-900/85 backdrop-blur-md border border-stone-200/80 dark:border-zinc-800 p-1.5 rounded-2xl shadow-card">
        <button id="btn-undo" title="撤销 (Ctrl/Cmd + Z)" class="p-2 rounded-xl text-stone-600 dark:text-zinc-300 hover:bg-stone-100 dark:hover:bg-zinc-800 disabled:opacity-35 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3"/></svg>
        </button>
        <button id="btn-redo" title="重做 (Ctrl/Cmd + Shift + Z)" class="p-2 rounded-xl text-stone-600 dark:text-zinc-300 hover:bg-stone-100 dark:hover:bg-zinc-800 disabled:opacity-35 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 15l6-6m0 0l-6-6m6 6H9a6 6 0 000 12h3"/></svg>
        </button>

        <div class="w-px h-4 bg-stone-200 dark:bg-zinc-700 mx-0.5"></div>

        <button id="btn-load-demo" title="加载示例灵感地图" class="hidden sm:flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-medium text-stone-600 dark:text-zinc-300 hover:bg-stone-100 dark:hover:bg-zinc-800 transition">
          示例
        </button>
        <button id="btn-clear-board" title="清空当前画布" class="px-2.5 py-1.5 rounded-xl text-xs font-medium text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/50 transition">
          清空
        </button>

        <div class="w-px h-4 bg-stone-200 dark:bg-zinc-700 mx-0.5"></div>

        <button id="btn-export-modal" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-medium bg-stone-900 dark:bg-zinc-100 text-white dark:text-zinc-900 hover:opacity-90 transition shadow-sm">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
          <span>导出大纲</span>
        </button>

        <button id="btn-theme-toggle" title="切换深色/浅色模式" class="p-2 rounded-xl text-stone-600 dark:text-zinc-300 hover:bg-stone-100 dark:hover:bg-zinc-800 transition">
          <svg id="icon-sun" class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <svg id="icon-moon" class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>
      </div>
    </header>

    <!-- 3. 语义整理悬浮工具栏（选中节点、群组或手绘图形时动态出现） -->
    <div id="floating-toolbar" class="hidden fixed z-40 animate-pop bg-white/95 dark:bg-zinc-900/95 backdrop-blur-md border border-stone-200 dark:border-zinc-700 px-2.5 py-1.5 rounded-2xl shadow-float flex items-center gap-1.5">
      <div id="toolbar-colors" class="flex items-center gap-1.5 px-1">
        <button data-color="neutral" title="中性白/灰" class="w-5 h-5 rounded-full bg-white border border-stone-300 hover:scale-110 transition"></button>
        <button data-color="yellow" title="灵感黄 · 核心点子" class="w-5 h-5 rounded-full bg-amber-300 border border-amber-400 hover:scale-110 transition"></button>
        <button data-color="blue" title="核心蓝 · 结构/方向" class="w-5 h-5 rounded-full bg-sky-300 border border-sky-400 hover:scale-110 transition"></button>
        <button data-color="green" title="行动绿 · 可执行方案" class="w-5 h-5 rounded-full bg-emerald-300 border border-emerald-400 hover:scale-110 transition"></button>
        <button data-color="purple" title="洞察紫 · 用户痛点/深度思考" class="w-5 h-5 rounded-full bg-purple-300 border border-purple-400 hover:scale-110 transition"></button>
        <button data-color="red" title="质疑红 · 风险/待验证" class="w-5 h-5 rounded-full bg-rose-300 border border-rose-400 hover:scale-110 transition"></button>
      </div>

      <div id="toolbar-divider-1" class="w-px h-4 bg-stone-200 dark:bg-zinc-700 mx-0.5"></div>

      <button id="btn-toolbar-branch" title="向右侧发散关联词条 (Tab)" class="flex items-center gap-1 px-2 py-1 rounded-xl text-xs font-medium text-stone-700 dark:text-zinc-200 hover:bg-stone-100 dark:hover:bg-zinc-800 transition">
        <span>+ 发散</span>
      </button>

      <button id="btn-toolbar-group" title="将选中词条归类到群组区域 (Ctrl/Cmd + G)" class="flex items-center gap-1 px-2 py-1 rounded-xl text-xs font-medium text-blue-600 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-950/50 transition">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        <span>归类群组</span>
      </button>

      <div class="w-px h-4 bg-stone-200 dark:bg-zinc-700 mx-0.5"></div>

      <button id="btn-toolbar-delete" title="删除选中项 (Delete / Backspace)" class="p-1.5 rounded-xl text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/50 transition">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
      </button>
    </div>

    <!-- 4. 底部交互工具坞与画布视口控制器 -->
    <footer class="fixed bottom-4 left-4 right-4 z-40 flex items-end justify-between pointer-events-none">
      <!-- 左下角快捷指引 -->
      <div class="pointer-events-auto hidden lg:flex items-center gap-2">
        <button id="btn-shortcuts-help" class="flex items-center gap-2 bg-white/85 dark:bg-zinc-900/85 backdrop-blur-md border border-stone-200/80 dark:border-zinc-800 px-3 py-1.5 rounded-2xl shadow-card text-xs text-stone-500 dark:text-zinc-400 hover:text-stone-800 dark:hover:text-zinc-200 transition">
          <span class="font-medium text-stone-700 dark:text-zinc-300">双击空白处</span> 输入词条
          <span class="text-stone-300 dark:text-zinc-700">|</span>
          <span><strong class="font-medium text-stone-700 dark:text-zinc-300">Ctrl+单击</strong> 加减选</span>
          <span class="ml-1 w-4 h-4 rounded-full bg-stone-100 dark:bg-zinc-800 text-stone-600 dark:text-zinc-300 flex items-center justify-center text-[10px] font-bold">?</span>
        </button>
      </div>

      <!-- 底部居中：选择 / 画笔 / 图形 / 直线 绘图工具坞 -->
      <div id="drawing-dock" class="pointer-events-auto mx-auto flex items-center gap-1 bg-white/92 dark:bg-zinc-900/92 backdrop-blur-md border border-stone-200/90 dark:border-zinc-800 p-1.5 rounded-2xl shadow-float">
        <!-- 选择指针 (V) -->
        <button data-tool="select" title="选择与框选指针 (V)" class="tool-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-medium bg-stone-900 dark:bg-zinc-100 text-white dark:text-zinc-900 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
          <span class="hidden sm:inline">选择</span>
        </button>

        <!-- 自由画笔 (P) -->
        <button data-tool="pen" title="自由画笔涂鸦/圈点 (P)" class="tool-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-medium text-stone-600 dark:text-zinc-300 hover:bg-stone-100 dark:hover:bg-zinc-800 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
          <span class="hidden sm:inline">画笔</span>
        </button>

        <!-- 矩形框 (R) -->
        <button data-tool="rect" title="拖拽拉出矩形框 (R)" class="tool-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-medium text-stone-600 dark:text-zinc-300 hover:bg-stone-100 dark:hover:bg-zinc-800 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/></svg>
          <span class="hidden sm:inline">矩形</span>
        </button>

        <!-- 圆形标记 (O) -->

  <script>
    /**
     * MindFlow 空间灵感白板核心引擎

    (function () {
      const STORAGE_KEY = 'mindflow_brainstorm_v1';
      const THEME_KEY = 'mindflow_theme_v1';

      // DOM 引用
      const viewportEl = document.getElementById('canvas-viewport');
      const worldLayerEl = document.getElementById('world-layer');
      const clustersLayerEl = document.getElementById('clusters-layer');
      const drawingsContainerEl = document.getElementById('drawings-container');
      const tempDrawingContainerEl = document.getElementById('temp-drawing-container');
      const edgesContainerEl = document.getElementById('edges-container');

      const quickInputConfirmEl = document.getElementById('quick-input-confirm');

      const boardTitleInputEl = document.getElementById('board-title-input');
      const zoomResetBtnEl = document.getElementById('btn-zoom-reset');

      // 核心应用状态
      let state = {
        title: '未命名头脑风暴',
        tokens: [],   // { id, text, x, y, color }
        edges: [],    // { id, source, target, label }
        clusters: [], // { id, title, x, y, width, height, color }
        drawings: []  // { id, type: 'pen'|'rect'|'ellipse'|'line', color, points?, x?, y?, width?, height?, x1?, y1?, x2?, y2? }
      };

      // 当前工具与默认画笔颜色
      let activeTool = 'select'; // 'select' | 'pen' | 'rect' | 'ellipse' | 'line'
      let activeStrokeColor = 'neutral';

      // 语义颜色映射（供 SVG 画笔与图形使用）
      const STROKE_PALETTE = {
        neutral: { light: '#57534e', dark: '#a1a1aa', fillLight: 'rgba(120, 113, 108, 0.08)', fillDark: 'rgba(161, 161, 170, 0.1)' },
        yellow:  { light: '#eab308', dark: '#facc15', fillLight: 'rgba(250, 204, 21, 0.14)', fillDark: 'rgba(250, 204, 21, 0.14)' },
        blue:    { light: '#0284c7', dark: '#38bdf8', fillLight: 'rgba(56, 189, 248, 0.14)', fillDark: 'rgba(56, 189, 248, 0.14)' },
        green:   { light: '#16a34a', dark: '#4ade80', fillLight: 'rgba(74, 222, 128, 0.14)', fillDark: 'rgba(74, 222, 128, 0.14)' },
        purple:  { light: '#9333ea', dark: '#c084fc', fillLight: 'rgba(192, 132, 252, 0.14)', fillDark: 'rgba(192, 132, 252, 0.14)' },
        red:     { light: '#e11d48', dark: '#fb7185', fillLight: 'rgba(251, 113, 133, 0.14)', fillDark: 'rgba(251, 113, 133, 0.14)' }
      };

      // 视口变换状态
      let viewport = {
        x: window.innerWidth / 2,
        y: window.innerHeight / 2,
        scale: 1
      };

      // 选中状态集合
      let selection = {
        tokens: new Set(),
        edges: new Set(),
        clusters: new Set(),
        drawings: new Set()
      };

      // 撤销/重做历史栈
      let historyPast = [];
      let historyFuture = [];
      const MAX_HISTORY = 40;

      // 交互状态机
      let interaction = {
        mode: 'idle', // 'idle' | 'pan' | 'marquee' | 'drag-items' | 'drag-cluster' | 'resize-cluster' | 'connect-edge' | 'drawing'
        startClientX: 0,
        startClientY: 0,
        startWorldX: 0,
        startWorldY: 0,
        startViewportX: 0,
        startViewportY: 0,
        initialPositions: new Map(), // 记录拖拽前各元素坐标
        marqueeBaseTokens: new Set(),
        marqueeBaseClusters: new Set(),
        marqueeBaseDrawings: new Set(),
        pendingToggleItem: null, // { type: 'token'|'drawing', id }
        activeClusterId: null,
        initialClusterRect: null,
        connectSourceId: null,
        draftDrawing: null, // 正在绘制的临时图形/笔迹
        hasMoved: false,
        pendingCreateWorldPos: null,
        pendingParentTokenId: null
      };

      let isSpacePressed = false;
      let currentExportTab = 'md';

      function isMultiSelectModifier(e) {
        return Boolean(e.ctrlKey || e.metaKey || e.shiftKey);
      }

      function uid(prefix = 'id') {
        return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 6)}`;
      }

      function cloneState(s) {
        return JSON.parse(JSON.stringify(s));
      }

      function screenToWorld(clientX, clientY) {
        return {
          x: (clientX - viewport.x) / viewport.scale,
          y: (clientY - viewport.y) / viewport.scale
        };
      }

      function worldToScreen(worldX, worldY) {
        return {
          x: worldX * viewport.scale + viewport.x,
          y: worldY * viewport.scale + viewport.y
        };
      }

      // 切换工具模式
      function setActiveTool(tool) {
        activeTool = tool;
        document.querySelectorAll('.tool-btn').forEach(btn => {
          const isMatch = btn.dataset.tool === tool;
          if (isMatch) {
            btn.className = 'tool-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-medium bg-stone-900 dark:bg-zinc-100 text-white dark:text-zinc-900 transition shadow-xs';
          } else {
            btn.className = 'tool-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-medium text-stone-600 dark:text-zinc-300 hover:bg-stone-100 dark:hover:bg-zinc-800 transition';
          }
        });

        if (tool === 'select') {
          viewportEl.classList.remove('drawing-mode-active');
          viewportEl.style.cursor = isSpacePressed ? 'grab' : 'default';
        } else {
          clearSelection();
          viewportEl.classList.add('drawing-mode-active');
          viewportEl.style.cursor = 'crosshair';
        }
      }

      // 轻量级 Toast 提示
      let toastTimer = null;
      function showToast(msg) {
        const el = document.getElementById('toast-msg');
        el.textContent = msg;
        el.classList.remove('hidden');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          el.classList.add('hidden');
        }, 2200);
      }

      // 自定义确认弹窗
      function showConfirm(title, desc, onConfirm) {
        const modal = document.getElementById('modal-confirm');
        document.getElementById('confirm-title').textContent = title;
        document.getElementById('confirm-desc').textContent = desc;
        modal.classList.remove('hidden');

        const okBtn = document.getElementById('btn-confirm-ok');
        const cancelBtn = document.getElementById('btn-confirm-cancel');

        const cleanup = () => {
          modal.classList.add('hidden');
          okBtn.onclick = null;
          cancelBtn.onclick = null;
        };

        okBtn.onclick = () => {
          cleanup();
          onConfirm();
        };
        cancelBtn.onclick = cleanup;
      }

      // 历史记录：推入快照
      function pushHistory() {
        historyPast.push(cloneState(state));
        if (historyPast.length > MAX_HISTORY) {
          historyPast.shift();
        }
        historyFuture = [];
        updateUndoRedoButtons();
      }

      function undo() {
        if (historyPast.length === 0) return;
        historyFuture.push(cloneState(state));
        state = historyPast.pop();
        clearSelection();
        renderAll();
        saveToLocalStorage();
        updateUndoRedoButtons();
        showToast('已撤销上一步操作');
      }

      function redo() {
        if (historyFuture.length === 0) return;
        historyPast.push(cloneState(state));
        state = historyFuture.pop();
        clearSelection();
        renderAll();
        saveToLocalStorage();
        updateUndoRedoButtons();
        showToast('已重做操作');
      }

      function updateUndoRedoButtons() {
        document.getElementById('btn-undo').disabled = historyPast.length === 0;
        document.getElementById('btn-redo').disabled = historyFuture.length === 0;
      }

      // 本地存储持久化
      function saveToLocalStorage() {
        try {
          const payload = { state, viewport };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
          const statusEl = document.getElementById('save-status');
          if (statusEl) {
            statusEl.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> 已保存`;
          }
        } catch (e) {
          console.warn('本地保存失败', e);
        }
      }

      function loadFromLocalStorage() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return false;
          const parsed = JSON.parse(raw);
          if (parsed && parsed.state) {
            state = {
              title: parsed.state.title || '未命名头脑风暴',
              tokens: Array.isArray(parsed.state.tokens) ? parsed.state.tokens : [],
              edges: Array.isArray(parsed.state.edges) ? parsed.state.edges : [],
              clusters: Array.isArray(parsed.state.clusters) ? parsed.state.clusters : [],
              drawings: Array.isArray(parsed.state.drawings) ? parsed.state.drawings : []
            };
            if (parsed.viewport) {
              viewport = parsed.viewport;
            }
            return true;
          }
        } catch (e) {
          console.warn('读取本地存档失败', e);
        }
        return false;
      }

      // 加载内置示例模板
      function loadDemoData() {
        state = {
          title: '新产品灵感发散 · AI 语音笔记',
          clusters: [
            { id: 'cl_1', title: '核心痛点洞察', x: -380, y: -170, width: 270, height: 290, color: 'purple' },
            { id: 'cl_2', title: 'MVP 核心功能', x: 130, y: -190, width: 320, height: 360, color: 'blue' }
          ],
          tokens: [
            { id: 'tk_root', text: '随时随地语音捕捉灵感', x: -70, y: -30, color: 'yellow' },
            { id: 'tk_1', text: '打字太慢，想法转瞬即逝', x: -340, y: -100, color: 'purple' },
            { id: 'tk_2', text: '通勤/散步时双手被占用', x: -340, y: 10, color: 'purple' },
            { id: 'tk_3', text: '锁屏一键录音 Widget', x: 170, y: -120, color: 'blue' },
